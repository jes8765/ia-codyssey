<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Game Mentor</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/mentor.css">

</head>

<body>

<header class="header">

    <div class="container">

        <a href="index.html" class="logo">
            GameForge AI
        </a>

        <nav class="nav">
            <a href="planner.html">Planner</a>
            <a href="resources.html">Resources</a>
            <a href="mentor.html">Mentor</a>
        </nav>

    </div>

</header>

<main>

    <div class="container">

        <!-- 여기부터 방금 작성한 section -->

        <section class="mentor">

            <h1>Game Mentor</h1>

            <p class="mentor-subtitle">
                Ask AI for feedback, debugging and game development advice.
            </p>

            <div class="mentor-input">

    <label>Your Question</label>

    <textarea
        id="mentor-question"
        placeholder="Ask anything about your game..."
    ></textarea>

    <!-- Quick Questions -->
    <div class="quick-questions">

        <p>Try asking</p>

        <div class="quick-question-buttons">

            <button
                class="quick-question-btn"
                data-question="이 게임의 핵심 플레이 루프를 검토하고 개선할 점을 알려줘.">
                기획 피드백
            </button>

            <button
                class="quick-question-btn"
                data-question="Unity에서 발생한 오류의 원인과 해결 방법을 알려줘.">
                Unity 디버깅
            </button>

            <button
                class="quick-question-btn"
                data-question="게임의 전투 밸런스를 검토하고 개선할 방법을 제안해줘.">
                밸런스
            </button>

            <button
                class="quick-question-btn"
                data-question="현재 게임 아이디어를 바탕으로 추가하면 좋을 요소를 제안해줘.">
                아이디어 보강
            </button>

        </div>

    </div>

    <button id="mentor-btn">
        Ask Mentor
    </button>

</div>

            </div>

            <div
                id="mentor-result"
                class="mentor-result hidden">

                <h2>AI Answer</h2>

                <div id="mentor-answer"></div>

                <div class="mentor-actions">

                    <button id="copy-btn">
                        Copy
                    </button>

                    <button id="save-btn">
                        Save
                    </button>

                </div>

            </div>
            <!-- 여기부터 추가 -->

    <div class="saved-advice">

        <h2>Saved Advice</h2>

        <div id="saved-advice-list"></div>

    </div>
            

        </section>

    </div>

</main>

<script src="js/mentor.js"></script>

</body>

</html>
