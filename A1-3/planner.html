<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Game Planner</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/planner.css">

</head>

<body>

<header class="header">
    <div class="container">

        <a href="index.html">
            <img
                src="images/GameForge_AI_logo_transparent.png"
                alt="GameForge AI"
                class="gameforge-logo"
            >
        </a>

        <nav class="nav">
            <a href="planner.html">Planner</a>
            <a href="resources.html">Resources</a>
            <a href="mentor.html">Mentor</a>
        </nav>

    </div>
</header>

<main>

    <div class="container">

        <section class="planner">

            <h1>Game Planner</h1>

            <p class="planner-subtitle">
                Create your next game idea with AI.
            </p>

            <!-- 선택 버튼이 JS로 생성되는 영역 -->
            <div id="planner-container"></div>

            <!-- 자유 입력 -->
            <div class="planner-inputs">

                <div class="input-group">
                    <label for="concept">Game Concept</label>
                    <textarea
                        id="concept"
                        placeholder="Describe your game idea..."
                    ></textarea>
                </div>

                <div class="input-group">
                    <label for="story">Story / Background</label>
                    <textarea
                        id="story"
                        placeholder="Describe the story or world..."
                    ></textarea>
                </div>

                <div class="input-group">
                    <label for="reference">Reference Games</label>
                    <textarea
                        id="reference"
                        placeholder="e.g. Hades, Stardew Valley"
                    ></textarea>
                </div>

                <div class="input-group">
                    <label for="request">Additional Requests</label>
                    <textarea
                        id="request"
                        placeholder="Anything else?"
                    ></textarea>
                </div>

                <div class="planner-actions">

                    <button id="preview-btn" class="secondary-btn">
                        Preview
                    </button>

                    <button id="generate-btn" class="primary-btn">
                        Generate with AI
                    </button>

                </div>

                <div class="advanced-section">

    <button
        id="advanced-toggle"
        class="secondary-btn">

        ▼ Advanced Options

    </button>

    <div
        id="advanced-options"
        class="advanced-options hidden">

        <div class="input-group">

            <label>Custom Genre</label>

            <input
                id="custom-genre"
                type="text"
                placeholder="e.g. Extraction Shooter">

        </div>

        <div class="input-group">

            <label>Custom Features</label>

            <input
                id="custom-features"
                type="text"
                placeholder="e.g. Souls-like">

        </div>

        <div class="input-group">

            <label>Custom Mechanics</label>

            <input
                id="custom-mechanics"
                type="text"
                placeholder="e.g. Time Rewind">

        </div>

        <div class="input-group">

            <label>Custom Mood</label>

            <input
                id="custom-mood"
                type="text"
                placeholder="e.g. Dreamcore">

        </div>

        <div class="input-group">

            <label>Custom Art Style</label>

            <input
                id="custom-artstyle"
                type="text"
                placeholder="e.g. PS2 Style">

        </div>

        <div class="input-group">

            <label>Custom Platform</label>

            <input
                id="custom-platform"
                type="text"
                placeholder="e.g. VR">

        </div>

    </div>

</div>

            </div>

            <!-- Preview -->
<div id="result-container" class="result-container hidden">

    <h2>Preview</h2>

    <div id="result-content"></div>

</div>

<!-- AI 결과 -->
<div id="ai-result-container" class="result-container hidden">

    <div id="loading-message" class="hidden">
        <p>🤖 AI is generating your game design...</p>
    </div>

    <h2>🤖 AI Generated Game Plan</h2>

    <div id="ai-result-content"></div>

</div>

        </section>

    </div>

</main>

<script src="js/planner.js"></script>

</body>

</html>
